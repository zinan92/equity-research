<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宏观 K 线周报</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>#footer{padding:16px 32px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.6}#footer code{word-break:break-all}.evidence-note{display:block;margin-top:18px;color:var(--faint);font-size:11px;word-break:break-all}</style>
    <style>
      .table-head{display:grid;grid-template-columns:150px 220px 100px 110px 160px 100px;gap:10px;padding:8px 14px;background:#fff;color:var(--faint);font-size:11px;border-bottom:1px solid var(--line)}
      .asset-row{grid-template-columns:150px 220px 100px 110px 160px 100px}
      .mini-cell{display:flex;align-items:center;gap:8px;min-width:0}.mini-chart{display:block;width:190px;height:70px}.last-candle{display:block;font-size:11px;font-weight:650;white-space:nowrap;color:var(--muted)}.last-candle.up{color:var(--green)}.last-candle.down{color:var(--red)}
      .latest-value b{display:block;font-size:13px;color:var(--navy)}.latest-value small{display:block;font-size:10px;color:var(--faint);margin-top:2px}.change{font-size:13px;font-weight:650}.change.up{color:var(--green)}.change.down{color:var(--red)}.change.flat{color:var(--muted)}
      .position-cell{display:flex;align-items:center;gap:8px}.position-meter{display:flex;flex-direction:column;width:8px;height:30px;gap:1px}.position-meter i{display:block;flex:1;background:#eef2f4;border-radius:1px}.position-meter.high i:nth-child(1){background:var(--red)}.position-meter.middle i:nth-child(2){background:var(--amber)}.position-meter.low i:nth-child(3){background:var(--green)}
      .trend{display:flex;align-items:center;gap:6px}.trend b{font-size:22px;line-height:1}.trend span{font-size:12px}.trend.up{color:var(--green)}.trend.down{color:var(--red)}.trend.flat{color:var(--muted)}
      @media(max-width:900px){.table-head{display:none}.asset-row{grid-template-columns:130px 125px 1fr 64px}.asset-row>.change,.asset-row>.position-cell{display:none}.mini-chart{width:120px;height:50px}.mini-cell{gap:4px}.last-candle{font-size:9px}.latest-value small{display:none}}
      @media(max-width:600px){.asset-row{grid-template-columns:110px 105px 1fr 55px}.mini-chart{width:105px;height:46px}.trend{justify-content:end}.trend b{font-size:20px}.trend span{display:none}}
      .period-chart canvas{display:block;width:100%;height:100%}.period-result{font-size:12px;font-weight:650;white-space:nowrap}.period-result.bullish{color:var(--green)}.period-result.bearish{color:var(--red)}.period-result.neutral{color:var(--amber)}.period-result.unavailable{color:var(--faint)}.period-conclusion{font-weight:650!important}.period-conclusion.bullish{color:var(--green)!important}.period-conclusion.bearish{color:var(--red)!important}.period-conclusion.neutral{color:var(--amber)!important}.period-conclusion.unavailable{color:var(--faint)!important}.combined-interpretation{padding:24px 30px;border-bottom:1px solid var(--line)}.combined-interpretation h3{font-size:20px;margin:6px 0 14px;color:var(--navy)}.combined-interpretation p{font-size:15px;color:var(--muted);line-height:1.7}.combined-interpretation strong{display:block;margin-top:15px;color:var(--green);font-size:14px}.combined-interpretation .evidence-note{display:block;margin-top:18px;color:var(--faint);font-size:11px;word-break:break-all}.unavailable-row{background:#fbfcfd}.mini-empty{display:grid;place-items:center;width:190px;height:70px;color:var(--faint);font-size:20px}
      .metric-strip{grid-template-columns:repeat(3,1fr)}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <strong>宏观 K 线周报</strong>
          <small>宏观命令中心 · <span id="sample-label">读取中</span></small>
        </div>
        <div class="top-meta"><span id="as-of">读取中</span><span id="coverage">读取中</span></div>
      </header>

      <div id="loading" class="state-panel loading" role="status">正在载入本周数据…</div>
      <div id="error" class="state-panel error" role="alert" hidden></div>

      <section id="app" hidden>
        <section class="overview-shell" id="overview">
          <aside class="asset-index" aria-label="资产导航">
            <small>资产导航</small>
            <div id="group-nav"></div>
            <p>点击任意资产进入单资产工作台。</p>
          </aside>
          <div class="overview-content">
            <div class="section-heading">
              <div><small>本周市场</small><h1>市场全景</h1></div>
            </div>
            <div id="groups"></div>
          </div>
        </section>

        <section id="detail" class="detail" hidden aria-live="polite"></section>
      </section>

      <footer id="footer" hidden></footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
