function agreementFor(asset){return asset.key==='gold'||asset.key==='nikkei'?'多周期偏强':asset.key==='star50'?'多周期分歧':'等待确认'}
function conditionFor(asset,tf,kind){const label=tf==='weekly'?'周线':tf==='daily'?'日线':'4H';return kind==='confirm'?`${label}收盘站上最近结构高点`:`${label}收盘跌破最近结构低点`}
function tfBlock(asset,tf,label,copy,meta){if(!copy)return '';return `<article class="timeframe"><div><div class="tf-label">${label} <span>· ${meta}</span></div><div class="chart-wrap"><canvas data-key="${asset.key}" data-tf="${tf}" data-rate="${asset.rate?'1':''}" data-fixture-date="2026-08-14"></canvas></div></div><div><p class="analysis">${copy}</p><div class="levels"><span class="confirm">确认：${conditionFor(asset,tf,'confirm')}</span><span class="invalid">失效：${conditionFor(asset,tf,'invalid')}</span></div></div></article>`}
function assetCard(asset){const stateLabel=stateFor(asset);return `<article class="asset-card" id="asset-${asset.key}"><header class="asset-head"><strong>${asset.name}</strong><span class="status">${stateLabel} · ${asset.context?'含 Context 周期':'周线＋日线'}</span></header>${tfBlock(asset,'weekly','WEEKLY',asset.weekly,'位置 / 长周期')}${tfBlock(asset,'daily','DAILY',asset.daily,'结构 / 中周期')}${tfBlock(asset,'4h','4H CONTEXT',asset.h4,'确认 / 短周期') }<div class="summary"><b>MULTI-TIMEFRAME SYNTHESIS</b><p>${asset.summary}</p><small>多周期状态：${agreementFor(asset)} · 初步状态：${stateLabel}</small></div></article>`}
function ranking(){return `<section class="ranking"><h2>本周机会排序</h2><p>仅在全部 17 个资产完成周线、日线和可用 Context 分析后生成。这里是 prototype fixture，不是实时建议。</p><div class="rank-grid">${ASSETS.map(asset=>`<article class="rank-card"><b>${stateFor(asset)}</b><strong>${asset.name}</strong><p>${agreementFor(asset)}；确认和失效条件均保留在资产卡片中。</p></article>`).join('')}</div></section>`}
function shell(content,note){return `<header class="top"><div class="brand">宏观 K 线周报 <span style="color:var(--faint);font-weight:400">Weekly Macro Tape</span></div><div class="meta"><span class="proto">PROTOTYPE / FIXTURE / NOT LIVE</span><span>WEEK_END 2026-08-14</span><span>39 slots</span></div></header><div class="variant-note">${note}</div><section class="hero"><div class="hero-grid"><div><div class="eyebrow">WEEKLY MACRO K-LINE</div><h1>本周宏观图谱</h1><p>先逐一读完 17 个市场的周线、日线与可用 Context 周期，再进入机会排序。没有总 Risk On/Off，也不展示内部系统字段。</p></div><div class="cutoff"><small>分析截止</small><b>2026-08-14</b><small>完成周度快照 · 仅供原型阅读</small></div></div><div class="notice">阅读顺序：图表 → 同周期分析 → 多周期结论 → 全部资产完成后再排序</div></section>${content}<footer class="footer">本页面是独立视觉原型，所有数字、分析和机会状态均为 FIXTURE / NOT LIVE；不产生真实市场判断或交易动作。</footer>`}
function variantA(){let out='';for(const ch of CHAPTERS){out+=`<section class="chapter"><div class="chapter-head"><h2>${ch.name}</h2><small>${ch.keys.length} 个市场 · 图和结论紧邻</small></div>${ch.keys.map(k=>assetCard(ASSETS.find(a=>a.key===k))).join('')}</section>`}return shell(out+ranking(),'A：每个资产完整展开，最适合检查 39 个图和文字是否过载。')}
function variantB(){const nav=CHAPTERS.map(ch=>`<div class="nav-group"><h4>${ch.name}</h4>${ch.keys.map(k=>{const a=ASSETS.find(x=>x.key===k);return `<button data-asset-nav="${a.key}">${a.name}</button>`}).join('')}</div>`).join('');const panes=ASSETS.map(a=>`<div class="b-pane" data-pane="${a.key}">${assetCard(a)}</div>`).join('');return shell(`<section class="workbench"><nav class="asset-nav"><h3>17 ASSETS</h3>${nav}</nav><div><p class="b-hint">B：按宏观章节选择资产，右侧一次阅读一个完整的周线 → 日线 → 4H 卡片。所有卡片已加载在页面中。</p>${panes}</div></section>${ranking()}`,'B：资产工作台，测试“逐个研究”是否比超长连续页面更容易形成判断。')}
function variantC(){const band=(tf,label,keys)=>`<section class="band"><header class="band-head"><h2>${label}</h2><small>${keys.length} slots · 先看同一周期，再看跨资产差异</small></header><div class="band-grid ${tf==='4h'?'context-grid':''}">${keys.map(k=>{const a=ASSETS.find(x=>x.key===k);return `<article class="band-item"><strong>${a.name}</strong><canvas data-key="${a.key}" data-tf="${tf}" data-rate="${a.rate?'1':''}" data-fixture-date="2026-08-14"></canvas><p>${tf==='weekly'?a.weekly:tf==='daily'?a.daily:(a.h4||'本资产没有独立 Context 周期，保留周线与日线。')}</p></article>`}).join('')}</div></section>`;const all=ASSETS.map(a=>a.key),ctx=ASSETS.filter(a=>a.context).map(a=>a.key);return shell(`<section class="timeline">${band('weekly','WEEKLY · 位置',all)}${band('daily','DAILY · 结构',all)}${band('4h','4H CONTEXT · 确认',ctx)}</section>${ranking()}`,'C：时间轴阅读，把所有市场的同一周期放在一起，测试周期优先级和横向扫描效率。')}
function render(){document.getElementById('app').innerHTML=state.variant==='A'?variantA():state.variant==='B'?variantB():variantC();document.getElementById('variantLabel').textContent=VARIANTS[state.variant];document.querySelectorAll('canvas').forEach(c=>chart(c,c.dataset.key,c.dataset.tf,!!c.dataset.rate));if(state.variant==='B'){const activate=k=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('active',x.dataset.pane===k));document.querySelectorAll('[data-asset-nav]').forEach(x=>x.classList.toggle('active',x.dataset.assetNav===k));document.querySelectorAll('[data-pane="'+k+'"] canvas').forEach(c=>chart(c,c.dataset.key,c.dataset.tf,!!c.dataset.rate))};document.querySelectorAll('[data-asset-nav]').forEach(b=>b.addEventListener('click',()=>{state.active=b.dataset.assetNav;activate(state.active)}));activate(state.active)} }
function change(delta){const keys=Object.keys(VARIANTS),i=keys.indexOf(state.variant);state.variant=keys[(i+delta+keys.length)%keys.length];history.replaceState({},'',location.pathname+'?prototype=1&variant='+state.variant);render()}
document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});render();
</script>
</body>
</html>
